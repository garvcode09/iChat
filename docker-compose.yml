# Monolith deployment: one container serving the API + built SPA.
#   docker compose up --build
# Provide secrets via a .env file next to this file (see the keys below).

services:
  app:
    build:
      context: .
      args:
        # Baked into the client bundle at build time.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_URI: ${DB_URI}
      FRONTEND_URL: ${FRONTEND_URL:-}
      # Read implicitly by @clerk/express at runtime.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
